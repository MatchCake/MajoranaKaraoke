[project]
name = "majorana-karaoke"
version = "0.0.1"
description = "A PennyLane device that translates any circuit into matchgates and simulates it with MatchCake's nif.qubit device."
authors = [{ name = "Jérémie Gince", email = "gincejeremie@gmail.com" }]
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy (>=1.23,<3.0.0)",
    "torch (>=2.1,<3.0.0)",
    "pennylane>=0.45.0",
    "matchcake>=1.0.0",
]
dynamic = ["readme"]

[project.urls]
Homepage = "https://github.com/MatchCake/MajoranaKaraoke"
Documentation = "https://MatchCake.github.io/MajoranaKaraoke"
Source = "https://github.com/MatchCake/MajoranaKaraoke"
Issues = "https://github.com/MatchCake/MajoranaKaraoke/issues"

[project.entry-points."pennylane.plugins"]
"mk.qubit" = "majorana_karaoke.mk_device:MajoranaKaraokeDevice"

[tool.pytest.ini_options]
pythonpath = [
    ".", "src",
]
testpaths = ["tests"]
addopts = [
    "-n=auto",
    "--cov-branch",
    "--cov=src",
    '--cov-report=xml:tests/.tmp/coverage.xml',
    "--cov-report=term-missing",
    "--durations=10",
]
filterwarnings = [
    # Third-party warnings we cannot fix in this codebase:
    # autograd's tracer still calls ``__array_wrap__`` the old way under NumPy 2.0.
    "ignore:.*__array_wrap__.*:DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest-cov>=6.1,<7",
    "pytest-json-report>=1.5,<2",
    "pytest>=8.4,<9",
    "docutils>=0.18,<0.20",
    "mypy>=1.15,<2",
    "ruff>=0.9,<1",
    "nbmake>=1.5,<2",
    "ipykernel>=6.29",
    "wheel>=0.45,<0.46",
    "build>=1.4,<2",
    "twine>=6.1,<7",
    "pytest-xdist>=3.7,<4",
    "pytest-timeout>=2.4",
    "pip>=25",
    "pre-commit>=4.5.1",
    "scikit-learn>=1.3.2",
    "matplotlib>=3.8.0",
]
docs = [
    "wheel>=0.45,<0.46",
    "build>=1.4,<2",
    "twine>=6.1,<7",
    "sphinx>=6.2,<6.3",
    "docutils>=0.18,<0.20",
    "karma-sphinx-theme>=0.0.8,<0.0.9",
    "myst-parser>=3.0.1",
    "myst-nb>=1.4.0",
]

[tool.uv]
default-groups = [
    "dev",
    "docs",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[project.optional-dependencies]
cpu = [
    "torch (>=2.1.2,<3.0.0)",
]
cu128 = [
    "torch (>=2.1.2,<3.0.0)",
]
cu130 = [
    "torch (>=2.1.2,<3.0.0)",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = [
    "setuptools>=77",
    "wheel>=0.45.1,<0.46",
    "build>=1.2.2.post1,<2",
    "twine>=6.1.0,<7",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.report]
exclude_also = [
    'def __repr__',
    'raise AssertionError',
    'raise NotImplementedError',
    'if __name__ == .__main__.:',
    'if TYPE_CHECKING:',
    '@(abc\.)?abstractmethod',
]

[[tool.mypy.overrides]]
module = [
    "pennylane.*",
    "matchcake.*",
    "sklearn.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"sphinx/source/conf.py" = ["E402"]
"tutorials/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
relative_files = true
