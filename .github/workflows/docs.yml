name: Docs

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:


jobs:
  Check-Docs:
    name: Check docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.2"
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv venv .venv
        uv sync --locked --dev --group docs --extra cpu

    - name: Fail on unresolved cross-references
      run: |
        set -eo pipefail
        uv run sphinx-build -b html sphinx/source sphinx/build/check 2>&1 | tee sphinx-build.log
        if grep -q "myst.xref_missing" sphinx-build.log; then
          echo "::error::Unresolved cross-references found. A relative link that does not point to a document in the docs renders as a dead same-page anchor."
          grep "myst.xref_missing" sphinx-build.log
          exit 1
        fi

  Build-Docs:
    name: Build docs
    runs-on: ubuntu-latest
    needs: Check-Docs
    # A single version of the documentation is published, the one of the main branch. A manual run publishes the
    # documentation of the branch it is started from.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.2"
        python-version: "3.11"
        enable-cache: true

    - name: Install dependencies
      run: |
        uv venv .venv
        uv sync --locked --dev --group docs --extra cpu

    - name: Build the sphinx docs
      run: |
        uv run sphinx-build -b html sphinx/source sphinx/build/html
        touch sphinx/build/html/.nojekyll

    - name: Checkout gh-pages branch
      run: |
        git checkout -b gh-pages
        git init

    - name: Copy build files to docs folder
      run: |
        mkdir -p docs
        cp -a sphinx/build/html/. docs/
        rm -rf sphinx/build

    - name: Commit to gh-pages branch
      run: |
        git add -f docs
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "Update docs"

    - name: Push to gh-pages branch
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        branch: gh-pages
        force: true
        directory: docs
